<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1814" />
  <title>Exhibition Estimates</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --card: #ffffff;
      --text: #1a1814;
      --muted: #6b6560;
      --accent: #047857;
      --border: #e8e4df;
      --danger: #be123c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    h1 { font-size: 1.1rem; margin: 0; }
    .sub { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
    main { padding: 12px; max-width: 960px; margin: 0 auto; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    label { display: block; font-size: 0.72rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
    input, select, button, textarea {
      font: inherit;
      width: 100%;
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 10px 12px;
      background: #fff;
      color: var(--text);
    }
    textarea { min-height: 72px; resize: vertical; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
    button.linkish { background: transparent; color: var(--accent); border: none; min-height: auto; padding: 4px 0; width: auto; font-size: 0.85rem; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .row { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
    @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
    .msg { font-size: 0.85rem; padding: 10px 12px; border-radius: 12px; margin-top: 8px; }
    .msg.ok { background: #ecfdf5; color: #065f46; }
    .msg.err { background: #fff1f2; color: var(--danger); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .actions button { width: auto; flex: 1 1 140px; }
    .total { font-size: 1.25rem; font-weight: 700; margin-top: 8px; }
    .hidden { display: none; }
    .suggest-wrap { position: relative; }
    .suggest-menu {
      position: absolute; left: 0; right: 0; top: calc(100% + 4px);
      max-height: 220px; overflow: auto; background: #fff;
      border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12); z-index: 20;
    }
    .suggest-item {
      display: block; width: 100%; text-align: left; min-height: 40px;
      padding: 10px 12px; border: none; border-radius: 0;
      background: #fff; color: var(--text); font-size: 0.85rem;
    }
    .suggest-item:hover, .suggest-item.active { background: rgba(4,120,87,.08); }
    .suggest-item small { color: var(--muted); margin-left: 6px; }
    .hint { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
    .scan-head {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
      margin-top: 12px; padding: 10px 12px; border-radius: 12px 12px 0 0;
      background: linear-gradient(90deg, #1d4ed8, #2563eb); color: #fff;
    }
    .scan-head h2 { margin: 0; font-size: 0.95rem; font-weight: 700; }
    .scan-badge {
      background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 999px;
      font-size: 0.75rem; font-weight: 600;
    }
    .bill-table-wrap {
      overflow-x: auto; margin-top: 0; border: 1px solid var(--border); border-radius: 0 0 12px 12px;
      background: #fff;
    }
    table.bill-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; table-layout: fixed; }
    table.bill-table th {
      text-align: left; font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.03em; color: var(--muted); padding: 8px 6px; border-bottom: 1px solid var(--border);
      background: #faf8f4;
    }
    table.bill-table td { border-bottom: 1px solid var(--border); padding: 8px 6px; vertical-align: top; color: var(--text); }
    table.bill-table td.collapsed-cell {
      word-break: break-word; overflow-wrap: anywhere; font-size: 0.76rem; line-height: 1.35;
    }
    table.bill-table td.collapsed-amt { text-align: right; font-weight: 700; color: #047857; white-space: nowrap; }
    table.bill-table tr.manual td { background: rgba(4,120,87,.03); }
    .line-grid { display: grid; gap: 8px; }
    .line-band { display: grid; gap: 6px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (min-width: 640px) { .line-band.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    @media (min-width: 900px) { .line-band.cols-7 { grid-template-columns: repeat(7, minmax(0, 1fr)); } }
    .field-label {
      display: block; font-size: 0.62rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.04em; color: #047857; margin-bottom: 2px;
    }
    .field-label.accent { color: #8b1e2d; }
    table.bill-table input, table.bill-table select {
      min-height: 36px; padding: 6px 8px; font-size: 0.78rem; border-radius: 10px;
      border: 1px solid #a7f3d0; background: #fff; color: var(--text); width: 100%;
    }
    table.bill-table input:read-only { background: #f8fafc; border-color: var(--border); }
    .cell-amt { font-weight: 800; white-space: nowrap; color: #047857; font-size: 0.95rem; }
    .line-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px; }
    .line-idx { font-weight: 700; font-size: 0.9rem; min-width: 28px; }
    .btn-del {
      width: auto; min-height: 36px; padding: 4px 10px; background: #fff; color: #be123c;
      border: 1px solid #fecdd3; font-size: 0.85rem;
    }
    .totals-bar {
      display: grid; gap: 8px; grid-template-columns: repeat(2, 1fr);
      margin-top: 12px; padding: 12px; border-radius: 12px;
      border: 1px solid var(--border); background: #faf8f4;
    }
    @media (min-width: 640px) { .totals-bar { grid-template-columns: repeat(5, 1fr); } }
    .totals-bar .lbl { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--muted); }
    .totals-bar .val { font-size: 0.95rem; font-weight: 700; color: var(--text); }
    .totals-bar .val.blue { color: #1d4ed8; }
    .net-pill {
      display: inline-block; margin-top: 4px; padding: 6px 14px; border-radius: 999px;
      background: #047857; color: #fff; font-weight: 800; font-size: 1rem;
    }
    .cust-form { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  </style>
</head>
<body>
  <header>
    <h1 id="appTitle">Exhibition Estimates</h1>
    <p class="sub" id="status">No pack loaded</p>
  </header>
  <main>
    <section class="card" id="setup">
      <label>1 · Load exhibition pack (.json from shop ERP)</label>
      <input type="file" id="packFile" accept=".json,application/json" />
      <div class="actions">
        <button type="button" class="secondary" id="exportBtn" disabled>Export return pack</button>
        <button type="button" class="secondary" id="refreshBtn" disabled>Refresh for next exhibition</button>
      </div>
      <p id="setupMsg" class="msg hidden"></p>
    </section>

    <section class="card hidden" id="billing">
      <div class="suggest-wrap">
        <label>Customer</label>
        <input id="custQ" placeholder="Search name or mobile…" autocomplete="off" />
        <div id="custMenu" class="suggest-menu hidden"></div>
        <button type="button" class="linkish" id="toggleCustForm">+ Customer</button>
      </div>
      <div id="custForm" class="cust-form hidden">
        <div class="row">
          <div><label>Name</label><input id="cfName" /></div>
          <div><label>Mobile</label><input id="cfMobile" inputmode="tel" /></div>
        </div>
        <div class="row" style="margin-top:8px">
          <div><label>PAN</label><input id="cfPan" /></div>
          <div><label>GSTIN</label><input id="cfGst" /></div>
        </div>
        <label style="margin-top:8px">Address</label>
        <textarea id="cfAddress"></textarea>
        <div class="row" style="margin-top:8px">
          <div><label>Birthday</label><input id="cfBirth" type="date" /></div>
          <div><label>Anniversary</label><input id="cfAnniv" type="date" /></div>
        </div>
        <label style="margin-top:8px">Notes</label>
        <textarea id="cfNotes"></textarea>
        <div class="actions">
          <button type="button" class="secondary" id="useCustForm">Use for quote</button>
        </div>
      </div>

      <div class="row" style="margin-top:10px">
        <div>
          <label>Scan barcode</label>
          <input id="scan" placeholder="Scan barcode…" autocomplete="off" />
        </div>
        <div>
          <label>Quote no.</label>
          <input id="estNo" readonly />
        </div>
      </div>

      <div class="row" style="margin-top:10px">
        <div>
          <label>Gold rate (₹/g)</label>
          <input id="goldRate" type="number" inputmode="decimal" step="0.01" />
        </div>
        <div>
          <label>Silver rate (₹/g)</label>
          <input id="silverRate" type="number" inputmode="decimal" step="0.01" />
        </div>
      </div>
      <div class="row" style="margin-top:10px">
        <div>
          <label>Slab</label>
          <select id="rateSlab">
            <option value="R">R</option>
            <option value="W">W</option>
            <option value="F">F</option>
          </select>
        </div>
        <div></div>
      </div>

      <div class="scan-head">
        <h2>Scanned products</h2>
        <span class="scan-badge" id="itemCount">0 items</span>
      </div>
      <div class="bill-table-wrap">
        <table class="bill-table">
          <thead id="linesHead" class="hidden"></thead>
          <tbody id="lines"></tbody>
        </table>
      </div>
      <div class="totals-bar" id="totalsBar">
        <div><div class="lbl">Items</div><div class="val" id="tItems">0</div></div>
        <div><div class="lbl">Total weight</div><div class="val blue" id="tWeight">0g</div></div>
        <div><div class="lbl">Subtotal</div><div class="val" id="tSub">₹0</div></div>
        <div><div class="lbl">GST (3%)</div><div class="val blue" id="tGst">₹0</div></div>
        <div><div class="lbl">Net total</div><div class="net-pill" id="tNet">₹0</div></div>
      </div>
      <div class="row">
        <div>
          <label>Collected (₹)</label>
          <input id="collected" type="number" inputmode="decimal" />
        </div>
      </div>
      <div class="actions">
        <button type="button" id="saveBtn">Save quote</button>
        <button type="button" class="secondary" id="clearBtn">Clear cart</button>
      </div>
      <p id="billMsg" class="msg hidden"></p>
    </section>

    <section class="card hidden" id="queueSec">
      <label>Saved on this device (<span id="qCount">0</span>)</label>
      <div id="queueList" style="font-size:0.85rem;color:var(--muted)"></div>
    </section>
  </main>
  <script src="billing-core.js"></script>
  <script>
    const KB = window.KcExhibitionBilling;
    const STORAGE = 'kc-exhibition-v2';
    let state = {
      pack: null,
      cart: [],
      queue: [],
      counters: {},
      rates: { gold_per_gram: 0, silver_per_gram: 0 },
      rateSlab: 'R',
      selectedCustomer: null,
      inlineCustomer: null,
      gstInvoiceItems: [],
      billingCatalogs: {},
      embeddedCustomers: [],
    };
    let custPickIdx = -1;
    let custKeyboardNav = false;
    let focusLineIdx = -1;
    let focusField = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE);
        if (raw) {
          state = { ...state, ...JSON.parse(raw) };
          if (state.counters?.nextEstimateSlot && !state.counters?.nextQuoteSlot) {
            state.counters.nextQuoteSlot = state.counters.nextEstimateSlot;
          }
        }
      } catch (_) {}
    }
    function saveState() {
      localStorage.setItem(STORAGE, JSON.stringify(state));
    }
    function uid() {
      return 'ex-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
    }
    function showMsg(el, text, ok) {
      el.textContent = text;
      el.className = 'msg ' + (ok ? 'ok' : 'err');
      el.classList.remove('hidden');
    }
    function fmt(n) {
      return (Math.round(Number(n || 0) * 100) / 100).toLocaleString('en-IN');
    }
    function norm(v) { return String(v || '').trim().toLowerCase(); }
    function esc(v) {
      return String(v ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
    }

    function currentRates() {
      return {
        gold_per_gram: Number(document.getElementById('goldRate').value) || state.rates.gold_per_gram || 0,
        silver_per_gram: Number(document.getElementById('silverRate').value) || state.rates.silver_per_gram || 0,
        gold_22k_per_gram: state.rates.gold_22k_per_gram || Number(document.getElementById('goldRate').value) || 0,
        gold_18k_per_gram: state.rates.gold_18k_per_gram || 0,
      };
    }

    function catalogForLine(line) {
      const name = line.invoice_item_name || '';
      return state.billingCatalogs[name] || [];
    }

    function slabSettingsRaw() {
      return state.pack?.snapshot?.slabSettings || state.pack?.snapshot?.settings?.reseller_slab_settings || {};
    }

    function recalcLine(line) {
      const slab = document.getElementById('rateSlab').value || 'R';
      return KB.recalcBillLine(line, currentRates(), slab, slabSettingsRaw());
    }

    function allCustomers() {
      const fromPack = state.pack?.snapshot?.customers;
      if (fromPack?.length) return fromPack;
      return state.embeddedCustomers || [];
    }

    function applyEmbeddedBoot() {
      const boot = window.__KC_EXHIBITION_EMBED__;
      if (!boot) return;
      if (boot.customers?.length) state.embeddedCustomers = boot.customers;
      if (boot.rates && !state.pack) {
        state.rates = { ...state.rates, ...boot.rates };
      }
      if (boot.gstInvoiceItems?.length && !state.gstInvoiceItems.length) {
        state.gstInvoiceItems = boot.gstInvoiceItems;
      }
      if (boot.shopName && !state.pack) setShopTitle({ shopName: boot.shopName });
      if (boot.customers?.length && !state.pack) {
        document.getElementById('status').textContent =
          `${boot.customers.length} customers embedded · load exhibition pack for barcodes`;
      }
    }

    function parseQuoteSlot(raw) {
      const m = String(raw || 'QUOTE-001').match(/QUOTE-(\d+)/i);
      return m ? parseInt(m[1], 10) || 1 : 1;
    }
    function peekNextQuoteNo() {
      let n = state.counters.nextQuoteSlot || 1;
      const used = new Set((state.queue || []).filter(q => q.type === 'estimate').map(q => q.localBillNumber));
      let num = `QUOTE-${String(n).padStart(3, '0')}`;
      while (used.has(num)) { n++; num = `QUOTE-${String(n).padStart(3, '0')}`; }
      return { num, slot: n };
    }
    function allocateQuoteNo() {
      const { num, slot } = peekNextQuoteNo();
      state.counters.nextQuoteSlot = slot + 1;
      return num;
    }
    function refreshQuoteNo() {
      document.getElementById('estNo').value = peekNextQuoteNo().num;
    }

    function setShopTitle(pack) {
      const shop = pack?.shopName || pack?.snapshot?.shopName || 'Exhibition';
      const title = shop + ' Estimates';
      document.title = title;
      const h1 = document.getElementById('appTitle');
      if (h1) h1.textContent = title;
    }

    function applyPack(pack) {
      state.pack = pack;
      const snap = pack.snapshot || {};
      state.rates = snap.rates || state.rates;
      state.gstInvoiceItems = snap.gstInvoiceItems || [];
      state.billingCatalogs = snap.billingCatalogs || {};
      const quoteHint = pack.counters?.nextQuoteNumber || pack.counters?.nextEstimateNumber;
      state.counters = { nextQuoteNumber: quoteHint, nextQuoteSlot: parseQuoteSlot(quoteHint) };
      saveState();
      setShopTitle(pack);
      const catCount = Object.keys(state.billingCatalogs).length;
      document.getElementById('status').textContent =
        `${(snap.customers || []).length} customers · ${(snap.pieces || []).length} barcodes · ${catCount} billing catalog(s)`;
      document.getElementById('billing').classList.remove('hidden');
      document.getElementById('queueSec').classList.remove('hidden');
      document.getElementById('exportBtn').disabled = false;
      document.getElementById('refreshBtn').disabled = false;
      document.getElementById('goldRate').value = String(state.rates.gold_per_gram || '');
      document.getElementById('silverRate').value = String(state.rates.silver_per_gram || '');
      document.getElementById('rateSlab').value = state.rateSlab || 'R';
      refreshQuoteNo();
      renderQueue();
      renderCart();
    }

    function refreshForNextExhibition() {
      if (!state.pack) return;
      state.queue = [];
      state.cart = [];
      state.selectedCustomer = null;
      state.inlineCustomer = null;
      state.counters.nextQuoteSlot = parseQuoteSlot(state.pack.counters?.nextQuoteNumber);
      document.getElementById('custQ').value = '';
      saveState();
      renderCart();
      renderQueue();
      refreshQuoteNo();
      showMsg(document.getElementById('setupMsg'), 'Cleared saved quotes. Next: ' + peekNextQuoteNo().num, true);
    }

    function findPiece(code) {
      const c = String(code || '').trim().toLowerCase();
      if (!c || !state.pack?.snapshot?.pieces) return null;
      const blocked = new Set((state.pack.snapshot.blockedBarcodes || []).map(b => String(b).toLowerCase()));
      if (blocked.has(c)) return { error: 'Already sold in shop' };
      const soldLocal = new Set();
      (state.queue || []).forEach(q => (q.payload?.lines || []).forEach(l => soldLocal.add(String(l.barcode || l.code || '').toLowerCase())));
      state.cart.forEach(l => soldLocal.add(String(l.barcode || l.code || '').toLowerCase()));
      if (soldLocal.has(c)) return { error: 'Already in cart or saved' };
      return state.pack.snapshot.pieces.find(p => String(p.barcode || '').toLowerCase() === c) || null;
    }

    function pieceToLine(piece) {
      const netWt = Number(piece.net_weight) || Number(piece.avg_weight) || 0;
      const line = recalcLine({
        ...piece,
        barcode: piece.barcode,
        code: piece.barcode,
        name: piece.name || piece.product_name,
        product_name: piece.product_name || piece.name,
        weightGm: netWt || null,
        originalWeightGm: netWt || null,
        net_weight: netWt || null,
        qty: piece.pcs || 1,
        stock_piece_id: piece.id ?? null,
        mc_rate_catalog: piece.mc_rate ?? null,
        mc_rate_slab_r: piece.mc_rate_slab_r ?? null,
        mc_rate_slab_w: piece.mc_rate_slab_w ?? null,
        mc_rate_slab_f: piece.mc_rate_slab_f ?? null,
        metal_slab_r_pct: piece.metal_slab_r_pct ?? null,
        metal_slab_w_pct: piece.metal_slab_w_pct ?? null,
        metal_slab_f_pct: piece.metal_slab_f_pct ?? null,
        manualEntryOpen: false,
      });
      return line;
    }

    function updateLine(idx, patch) {
      state.cart = state.cart.map((l, i) => (i === idx ? recalcLine({ ...l, ...patch }) : l));
      saveState();
      renderCart();
    }

    function removeLine(idx) {
      state.cart = state.cart.filter((_, i) => i !== idx);
      saveState();
      renderCart();
    }

    function catalogProductsForLine(line) {
      const catalog = catalogForLine(line);
      return KB.productNamesForSku(catalog, line.sku || '');
    }

    function applyManualField(idx, field, rawValue) {
      const line = state.cart[idx];
      if (!line) return;
      const rateSlab = document.getElementById('rateSlab').value || 'R';
      const editable = !!line.manualEntry;
      const catalog = catalogForLine(line);
      let patch = {};
      const val = String(rawValue ?? '').trim();
      const products = catalogProductsForLine(line);
      const product = KB.findCatalogProduct(products, line.name || '');

      if (field === 'sku' && editable) {
        patch.sku = val;
        const style = KB.findStyleForSku(catalog, val);
        if (style) patch.style_code = style;
        patch.designProductOptions = KB.productNamesForSku(catalog, val);
      } else if (field === 'style_code' && editable) {
        patch.style_code = val;
      } else if (field === 'name' && editable) {
        patch.name = val;
        const hit = KB.findCatalogProduct(products, val);
        if (hit) Object.assign(patch, KB.patchLineFromCatalogProduct(line, hit));
      } else if (field === 'size') {
        if (editable && product) Object.assign(patch, KB.patchLineFromCatalogSize(line, product, val));
        else patch.size = val || null;
      } else if (field === 'weightGm') {
        const n = Number(val);
        patch.weightGm = Number.isFinite(n) ? n : null;
        patch.net_weight = patch.weightGm;
        patch.originalWeightGm = patch.weightGm;
      } else if (field === 'qty') {
        patch.qty = Math.max(0, parseInt(val, 10) || 0);
      } else if (field === 'packaging_label' && editable) {
        const hit = KB.findDesignOptionLabel(line.designBoxOptions, val);
        const wt = Number(line.weightGm ?? line.originalWeightGm ?? 0) || 0;
        patch.packaging_label = hit?.label ?? val;
        patch.box_charges = hit?.box_charges ?? 0;
        if ((line.mrpMode || wt <= 0) && hit?.fixed_price != null) {
          const list = hit.fixed_price;
          const slab = document.getElementById('rateSlab').value || 'R';
          const slabPrice = KB.giftMrpSlabPrice(list, slab, KB.parseSlabSettingsFromUser(slabSettingsRaw()));
          patch.fixed_price = slabPrice;
          patch.unitInr = slabPrice;
          patch.mrpListPrice = list;
        }
      } else if (field === 'finish_label' && editable) {
        const hit = KB.findDesignOptionLabel(line.designFinishOptions, val);
        patch.finish_label = hit?.label ?? val;
        patch.stone_charges = hit?.stone_charges ?? 0;
        if (hit?.fixed_price != null) {
          const slab = document.getElementById('rateSlab').value || 'R';
          const slabPrice = KB.giftMrpSlabPrice(hit.fixed_price, slab, KB.parseSlabSettingsFromUser(slabSettingsRaw()));
          patch.fixed_price = slabPrice;
          patch.unitInr = slabPrice;
          patch.mrpListPrice = hit.fixed_price;
          patch.mrpMode = true;
        }
      } else if (field === 'box_charges' || field === 'stone_charges') {
        patch[field] = Number(val) || 0;
      } else if (field === 'metal_slab_pct') {
        const n = Number(val);
        const key = rateSlab === 'W' ? 'metal_slab_w_pct' : rateSlab === 'F' ? 'metal_slab_f_pct' : 'metal_slab_r_pct';
        patch[key] = val === '' ? null : (Number.isFinite(n) ? n : null);
      } else if (['gross_weight','bag_wt','bags','purity','wastage_pct','mc_rate','mc_rate_slab_r','mc_rate_slab_w','mc_rate_slab_f','fixed_price','ratePerGram'].includes(field)) {
        const n = Number(val);
        patch[field] = val === '' ? null : (Number.isFinite(n) ? n : line[field]);
        if (field === 'ratePerGram' && val !== '') patch.rateLocked = true;
      } else if (field === 'mc_type') {
        patch.mc_type = val;
      } else if (field === 'metal_type') {
        patch.metal_type = val || 'silver';
      } else if (editable) {
        patch[field] = val;
      } else {
        return;
      }

      updateLine(idx, patch);

      if (!editable) return;
      const updated = state.cart[idx];
      let next = KB.nextManualEntryField(field, updated, rateSlab);
      if (field === 'name') {
        const hit = KB.findCatalogProduct(catalogProductsForLine(updated), updated.name || '');
        if (hit) next = KB.nextFieldAfterCatalogProduct(hit);
      }
      if (next) {
        focusLineIdx = idx;
        focusField = next;
        renderCart();
      } else if (updated.manualEntry) {
        updateLine(idx, { manualEntryOpen: false });
        focusLineIdx = -1;
        focusField = null;
        renderCart();
      }
    }

    function renderCart() {
      const tbody = document.getElementById('lines');
      const thead = document.getElementById('linesHead');
      const rateSlab = document.getElementById('rateSlab').value || 'R';
      const MC_TYPES = ['mc/gm', 'mc/pc'];
      const collapsedCols = KB.visibleCollapsedBillTableCols(state.cart, rateSlab);
      const colWidth = collapsedCols.length ? (100 / collapsedCols.length).toFixed(2) + '%' : 'auto';

      function cellInput(idx, field, val, list, manual, readOnly) {
        const id = `line-${idx}-${field}`;
        const autoFocus = focusLineIdx === idx && focusField === field ? ' autofocus' : '';
        const ro = readOnly ? ' readonly' : '';
        if (list?.length) {
          return `<select data-idx="${idx}" data-field="${field}" id="${id}"${autoFocus}${manual ? '' : ' disabled'}>` +
            `<option value="">—</option>` +
            list.map((o) => {
              const label = typeof o === 'string' ? o : (o.label || o.name || o);
              const sel = norm(val) === norm(label) ? ' selected' : '';
              return `<option value="${esc(label)}"${sel}>${esc(label)}</option>`;
            }).join('') +
            `</select>`;
        }
        return `<input data-idx="${idx}" data-field="${field}" id="${id}" value="${esc(val ?? '')}"${autoFocus}${ro} />`;
      }

      function fieldBlock(label, html, accent) {
        return `<label class="field-label${accent ? ' accent' : ''}">${label}${html}</label>`;
      }

      if (!state.cart.length) {
        thead.classList.add('hidden');
        thead.innerHTML = '';
        tbody.innerHTML = '<tr><td style="color:var(--muted);padding:16px">Scan a barcode to add items.</td></tr>';
      } else {
        thead.classList.remove('hidden');
        thead.innerHTML =
          '<tr><th style="width:2rem">#</th>' +
          collapsedCols.map((c) => `<th style="width:${colWidth}">${esc(c.label)}</th>`).join('') +
          '<th style="width:2rem"></th></tr>';

        tbody.innerHTML = state.cart.map((l, idx) => {
          const manual = !!l.manualEntry;
          const expanded = manual && l.manualEntryOpen !== false;
          if (!expanded) {
            const cells = collapsedCols.map((c) => {
              const raw = KB.billCellText(l, c.key, rateSlab);
              const text = c.key === 'amount' ? `₹${fmt(raw)}` : esc(String(raw ?? ''));
              const cls = c.key === 'amount' ? 'collapsed-amt' : 'collapsed-cell';
              return `<td class="${cls}" title="${esc(String(raw ?? ''))}">${text}</td>`;
            }).join('');
            return `<tr class="${manual ? 'manual' : ''}" data-row="${idx}">
              <td>#${idx + 1}</td>${cells}
              <td><button type="button" class="btn-del" data-del="${idx}">✕</button></td>
            </tr>`;
          }

          const catalog = catalogForLine(l);
          const products = manual ? (l.designProductOptions || KB.productNamesForSku(catalog, l.sku || '')) : [];
          const product = manual ? KB.findCatalogProduct(products, l.name || '') : null;
          const skuOpts = manual ? KB.uniqueSkusFromCatalog(catalog).map((s) => s.sku) : [];
          const styleOpts = manual ? KB.findStylesForSku(catalog, l.sku || '') : [];
          const sizeOpts = product?.sizes?.length > 1 ? product.sizes.map((s) => s.size_label) : null;
          const boxOpts = (l.designBoxOptions?.length >= 2) ? l.designBoxOptions.map((o) => o.label) : null;
          const finishOpts = (l.designFinishOptions?.length >= 2) ? l.designFinishOptions.map((o) => o.label) : null;

          const row1 = [
            fieldBlock('Barcode', cellInput(idx, 'barcode', l.barcode || l.code, null, manual, true), true),
            fieldBlock('SKU', manual ? cellInput(idx, 'sku', l.sku, skuOpts, true, false) : cellInput(idx, 'sku', l.sku, null, false, true), true),
            fieldBlock('Style', manual ? cellInput(idx, 'style_code', l.style_code, styleOpts, true, false) : cellInput(idx, 'style_code', l.style_code, null, false, true), true),
            fieldBlock('Product', manual ? cellInput(idx, 'name', l.name, products.map((p) => p.name), true, false) : cellInput(idx, 'name', l.name || l.product_name, null, false, true), true),
            fieldBlock('Inv.item', cellInput(idx, 'invoice_item_name', l.invoice_item_name, null, manual, true), true),
            fieldBlock('HSN', cellInput(idx, 'hsn_code', l.hsn_code, null, manual, true), true),
            fieldBlock('Size', manual || sizeOpts ? cellInput(idx, 'size', l.size, sizeOpts, manual || !!sizeOpts, !manual && !sizeOpts) : cellInput(idx, 'size', l.size, null, false, true)),
          ].join('');

          const weightBand = [
            ['NetWt', 'weightGm'],
            ['Gross', 'gross_weight'],
            ['Bags', 'bags'],
            ['BagWt', 'bag_wt'],
            ['Metal%', 'metal_slab_pct'],
            ['Purity', 'purity'],
            ['Wast%', 'wastage_pct'],
            ['Rate', 'ratePerGram'],
          ].map(([lbl, key]) => {
            const val = key === 'metal_slab_pct' ? (KB.billCellText(l, key, rateSlab) || '') : l[key];
            const editable = manual || key === 'weightGm' || key === 'metal_slab_pct';
            return fieldBlock(lbl, cellInput(idx, key, val, null, editable, !editable));
          }).join('');

          const mcSlabKey = rateSlab === 'W' ? 'mc_rate_slab_w' : rateSlab === 'F' ? 'mc_rate_slab_f' : 'mc_rate_slab_r';
          const chargeBand = [
            fieldBlock('MC', cellInput(idx, 'mc_rate', l.mc_rate, null, manual, !manual)),
            KB.billingShowsMcSlabRColumn(rateSlab)
              ? fieldBlock('MC R', cellInput(idx, mcSlabKey, l[mcSlabKey], null, manual, !manual))
              : '',
            fieldBlock('MCType', cellInput(idx, 'mc_type', l.mc_type, MC_TYPES, manual, !manual)),
            fieldBlock('PCS', cellInput(idx, 'qty', l.qty ?? l.pcs ?? 1, null, true, !manual)),
            boxOpts
              ? fieldBlock('Box', cellInput(idx, 'packaging_label', l.packaging_label || '', boxOpts, true, false))
              : fieldBlock('Box', cellInput(idx, 'box_charges', l.box_charges, null, manual, !manual)),
            finishOpts
              ? fieldBlock('Finish', cellInput(idx, 'finish_label', l.finish_label || '', finishOpts, true, false))
              : fieldBlock('Finish', cellInput(idx, 'stone_charges', l.stone_charges, null, manual, !manual)),
            fieldBlock('Metal', cellInput(idx, 'metal_type', l.metal_type || 'silver', null, manual, !manual)),
            fieldBlock('Fixed', cellInput(idx, 'fixed_price', l.fixed_price, null, manual, !manual)),
          ].join('');

          return `<tr class="${manual ? 'manual' : ''}" data-row="${idx}">
            <td colspan="${collapsedCols.length + 2}">
              <div class="line-grid">
                <div class="line-top">
                  <span class="line-idx">#${idx + 1}</span>
                  <span class="cell-amt">₹${fmt(l.lineTotalInr)}</span>
                  <button type="button" class="btn-del" data-del="${idx}">✕</button>
                </div>
                <div class="line-band cols-4">${row1}</div>
                <div class="line-band cols-7">${weightBand}</div>
                <div class="line-band cols-7">${chargeBand}</div>
              </div>
            </td>
          </tr>`;
        }).join('');
      }
      focusLineIdx = -1;
      focusField = null;
      document.getElementById('itemCount').textContent = `${state.cart.length} item${state.cart.length === 1 ? '' : 's'}`;
      const totals = KB.cartTotalsFromLines(state.cart);
      document.getElementById('tItems').textContent = String(totals.items);
      document.getElementById('tWeight').textContent = `${Math.round(totals.weight * 100) / 100}g`;
      document.getElementById('tSub').textContent = `₹${fmt(totals.subtotal)}`;
      document.getElementById('tGst').textContent = `₹${fmt(totals.gst)}`;
      document.getElementById('tNet').textContent = `₹${fmt(totals.netTotal)}`;
      document.getElementById('collected').value = totals.netTotal ? String(Math.round(totals.netTotal)) : '';
    }

    function recalcCart() {
      state.rateSlab = document.getElementById('rateSlab').value || 'R';
      state.rates = { ...state.rates, ...currentRates() };
      state.cart = state.cart.map((l) => recalcLine(l));
      saveState();
      renderCart();
    }

    function addManualLine(category) {
      const invoiceItem = KB.findInvoiceItemForCategory(category, state.gstInvoiceItems);
      if (!invoiceItem) {
        showMsg(document.getElementById('billMsg'), 'Re-download pack — GST invoice items missing.', false);
        return;
      }
      const usedCodes = state.cart.flatMap((l) => [l.code, l.barcode].filter(Boolean));
      const slab = document.getElementById('rateSlab').value || 'R';
      const line = recalcLine(KB.createManualBillLine(category, invoiceItem, slab, usedCodes));
      state.cart.push(line);
      focusLineIdx = state.cart.length - 1;
      focusField = KB.firstManualEntryField(line);
      saveState();
      renderCart();
      showMsg(document.getElementById('billMsg'), `Manual ${category} line — fill SKU, Style, Product`, true);
    }

    function renderQueue() {
      document.getElementById('qCount').textContent = (state.queue || []).length;
      document.getElementById('queueList').innerHTML = (state.queue || []).slice(-8).reverse().map(q =>
        `<div>${q.type} · ${q.localBillNumber || q.id} · ₹${fmt(q.payload?.total_inr || 0)}</div>`
      ).join('') || 'Nothing saved yet';
    }

    function filterCustomers(q) {
      const customers = allCustomers();
      const n = norm(q);
      if (!n) return customers.slice(0, 12);
      return customers.filter(c =>
        norm(c.name).includes(n) || norm(c.mobile).includes(n.replace(/\D/g, ''))
      ).slice(0, 12);
    }

    function selectCustomer(c) {
      if (!c) return;
      state.selectedCustomer = c;
      state.inlineCustomer = null;
      document.getElementById('custQ').value = c.mobile ? `${c.name} · ${c.mobile}` : c.name;
      const slab = String(c.rate_slab || 'R').toUpperCase();
      if (['R', 'W', 'F'].includes(slab)) {
        document.getElementById('rateSlab').value = slab;
        state.rateSlab = slab;
        recalcCart();
      }
      document.getElementById('custMenu').classList.add('hidden');
      custPickIdx = -1;
      saveState();
    }

    function renderCustMenu() {
      const q = document.getElementById('custQ').value;
      const menu = document.getElementById('custMenu');
      const list = filterCustomers(q);
      if (!list.length) { menu.classList.add('hidden'); return; }
      menu.innerHTML = list.map((c, i) =>
        `<button type="button" class="suggest-item${custPickIdx === i ? ' active' : ''}" data-id="${c.id}">${c.name}${c.mobile ? `<small>${c.mobile}</small>` : ''}</button>`
      ).join('');
      menu.classList.remove('hidden');
      if (custKeyboardNav && custPickIdx >= 0) {
        const active = menu.querySelector('.suggest-item.active');
        if (active) active.scrollIntoView({ block: 'nearest' });
        custKeyboardNav = false;
      }
    }

    document.getElementById('toggleCustForm').addEventListener('click', () => {
      document.getElementById('custForm').classList.toggle('hidden');
    });
    document.getElementById('useCustForm').addEventListener('click', () => {
      const name = document.getElementById('cfName').value.trim();
      if (!name) { showMsg(document.getElementById('billMsg'), 'Customer name required', false); return; }
      state.inlineCustomer = {
        name,
        mobile: document.getElementById('cfMobile').value.trim(),
        pan: document.getElementById('cfPan').value.trim(),
        gstin: document.getElementById('cfGst').value.trim(),
        address: document.getElementById('cfAddress').value.trim(),
        birthdate: document.getElementById('cfBirth').value || null,
        anniversary_date: document.getElementById('cfAnniv').value || null,
        notes: document.getElementById('cfNotes').value.trim(),
      };
      state.selectedCustomer = null;
      document.getElementById('custQ').value = name + (state.inlineCustomer.mobile ? ' · ' + state.inlineCustomer.mobile : '');
      document.getElementById('custForm').classList.add('hidden');
      saveState();
      showMsg(document.getElementById('billMsg'), 'Customer set for this quote', true);
    });

    document.getElementById('custQ').addEventListener('input', () => { custPickIdx = -1; renderCustMenu(); });
    document.getElementById('custQ').addEventListener('focus', renderCustMenu);
    document.getElementById('custQ').addEventListener('keydown', (e) => {
      const list = filterCustomers(e.target.value);
      if (e.key === 'ArrowDown') { e.preventDefault(); custKeyboardNav = true; custPickIdx = Math.min(custPickIdx + 1, list.length - 1); renderCustMenu(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); custKeyboardNav = true; custPickIdx = Math.max(custPickIdx - 1, 0); renderCustMenu(); }
      else if (e.key === 'Enter' && custPickIdx >= 0 && list[custPickIdx]) { e.preventDefault(); selectCustomer(list[custPickIdx]); }
    });
    document.getElementById('custMenu').addEventListener('click', (e) => {
      const btn = e.target.closest('.suggest-item');
      if (!btn) return;
      const custId = Number(btn.dataset.id);
      const customers = allCustomers();
      selectCustomer(customers.find(c => Number(c.id) === custId) || null);
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.suggest-wrap')) document.getElementById('custMenu').classList.add('hidden');
    });

    document.getElementById('packFile').addEventListener('change', async (e) => {
      const f = e.target.files?.[0];
      if (!f) return;
      try {
        const pack = JSON.parse(await f.text());
        if (!pack.snapshot?.pieces) throw new Error('Invalid exhibition pack');
        applyPack(pack);
        showMsg(document.getElementById('setupMsg'), 'Pack loaded. Scan barcodes to bill.', true);
      } catch (err) {
        showMsg(document.getElementById('setupMsg'), err.message || 'Could not read pack', false);
      }
    });

    ['goldRate', 'silverRate', 'rateSlab'].forEach(id => {
      document.getElementById(id).addEventListener('change', recalcCart);
      document.getElementById(id).addEventListener('input', recalcCart);
    });

    document.getElementById('lines').addEventListener('change', (e) => {
      const t = e.target;
      const idx = Number(t.dataset.idx);
      const field = t.dataset.field;
      if (!Number.isFinite(idx) || !field) return;
      applyManualField(idx, field, t.value);
    });
    document.getElementById('lines').addEventListener('keydown', (e) => {
      const t = e.target;
      if (e.key !== 'Enter' || !t.dataset?.idx) return;
      e.preventDefault();
      applyManualField(Number(t.dataset.idx), t.dataset.field, t.value);
    });
    document.getElementById('lines').addEventListener('dblclick', (e) => {
      const tr = e.target.closest('tr[data-row]');
      if (!tr || e.target.closest('.btn-del')) return;
      const idx = Number(tr.dataset.row);
      const line = state.cart[idx];
      if (line?.manualEntry) {
        updateLine(idx, { manualEntryOpen: true });
        focusLineIdx = idx;
        focusField = KB.firstManualEntryField(line);
        renderCart();
      }
    });

    document.getElementById('lines').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-del]');
      if (!btn) return;
      removeLine(Number(btn.dataset.del));
    });

    document.getElementById('scan').addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const code = e.target.value.trim();
      e.target.value = '';
      const rates = currentRates();
      if (!rates.silver_per_gram && !rates.gold_per_gram) {
        showMsg(document.getElementById('billMsg'), 'Enter gold/silver rate first', false);
        return;
      }
      const shortcut = KB.resolveBillingScanShortcut(code);
      if (shortcut) {
        addManualLine(shortcut);
        return;
      }
      const hit = findPiece(code);
      if (!hit) { showMsg(document.getElementById('billMsg'), 'Barcode not found', false); return; }
      if (hit.error) { showMsg(document.getElementById('billMsg'), hit.error, false); return; }
      state.cart.push(pieceToLine(hit));
      saveState();
      renderCart();
      showMsg(document.getElementById('billMsg'), 'Added ' + hit.barcode, true);
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      state.cart = [];
      saveState();
      renderCart();
      refreshQuoteNo();
    });

    document.getElementById('saveBtn').addEventListener('click', () => {
      if (!state.cart.length) { showMsg(document.getElementById('billMsg'), 'Add at least one item', false); return; }
      const cust = state.selectedCustomer;
      const inline = state.inlineCustomer;
      const custQ = document.getElementById('custQ').value.trim();
      let customerName = cust?.name || inline?.name || custQ || 'Walk-in';
      let customerMobile = cust?.mobile || inline?.mobile || '';
      let customerMeta = inline || cust || null;
      if (!cust && !inline && custQ) {
        const customers = allCustomers();
        const match = customers.find(c => norm(c.name) === norm(custQ) || norm(c.mobile) === norm(custQ));
        if (match) { customerName = match.name; customerMobile = match.mobile || ''; customerMeta = match; state.selectedCustomer = match; }
      }
      const total = state.cart.reduce((s, l) => s + (Number(l.lineTotalInr) || 0), 0);
      const collected = Number(document.getElementById('collected').value) || total;
      const localBillNumber = allocateQuoteNo();
      const opId = uid();
      const rates = currentRates();
      const item = {
        id: opId,
        type: 'estimate',
        localBillNumber,
        createdAt: new Date().toISOString(),
        localCustomerId: state.selectedCustomer?.id || null,
        payload: {
          bill_type: 'estimate',
          bill_number: localBillNumber,
          customer_id: state.selectedCustomer?.id || null,
          customer_name: customerName,
          customer_mobile: customerMobile || null,
          customer_pan: customerMeta?.pan || null,
          customer_gstin: customerMeta?.gstin || null,
          customer_address: customerMeta?.address || null,
          customer_birthdate: customerMeta?.birthdate || null,
          customer_anniversary: customerMeta?.anniversary_date || null,
          customer_notes: customerMeta?.notes || null,
          total_inr: collected,
          status: 'draft',
          payment_method: 'cash',
          bill_date: new Date().toISOString().slice(0, 10),
          lines: state.cart,
          offline_op_id: opId,
          session: {
            offlineOpId: opId,
            collectedAmountInr: collected,
            netTotalInr: collected,
            paymentMethod: 'cash',
            rateSlab: document.getElementById('rateSlab').value || 'R',
            goldPerG: rates.gold_per_gram,
            silverPerG: rates.silver_per_gram,
            displayRates: [
              { metal_type: 'gold', display_rate: Math.round(rates.gold_per_gram * 10) },
              { metal_type: 'silver', display_rate: Math.round(rates.silver_per_gram * 1000) },
            ],
          },
        },
      };
      state.queue.push(item);
      state.cart = [];
      state.selectedCustomer = null;
      state.inlineCustomer = null;
      document.getElementById('custQ').value = '';
      saveState();
      renderCart();
      renderQueue();
      refreshQuoteNo();
      showMsg(document.getElementById('billMsg'), `Saved ${localBillNumber}`, true);
    });

    document.getElementById('refreshBtn').addEventListener('click', refreshForNextExhibition);
    document.getElementById('exportBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify({
        kind: 'kc-exhibition-return',
        exportedAt: new Date().toISOString(),
        queue: state.queue || [],
      }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `exhibition-return-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      showMsg(document.getElementById('setupMsg'), 'Return pack downloaded. Upload in shop ERP → Exhibition.', true);
    });

    loadState();
    applyEmbeddedBoot();
    if (state.pack) applyPack(state.pack);
    else {
      if (state.rates?.gold_per_gram) document.getElementById('goldRate').value = String(state.rates.gold_per_gram);
      if (state.rates?.silver_per_gram) document.getElementById('silverRate').value = String(state.rates.silver_per_gram);
      renderCart();
      renderQueue();
    }
  </script>
</body>
</html>
